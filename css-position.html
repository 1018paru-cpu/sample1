<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/css-position.css">
    <title>CSS Position</title>
</head>
<body>
    <!--position Static-->
    <h1>Position Static Example</h1>

<div class="box static-box">
    Position: Static (Default Flow)
</div>

<!--position Relative-->
<div class="box relative-box">
    Position : Relative (This will move)
</div>

<!--Position Absolute-->
<div class="parent-container">
    <p style="margin: 10px">Parent Container</p>
    <div class="box absolute-box">
        Position: Absolute
    </div>
</div>
</body>
</html>
